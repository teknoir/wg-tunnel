    uses: teknoir/ci-workflows/.github/workflows/image.yml@main
    with:
      image: wg-agent
      target: wg-agent
      platforms: linux/amd64,linux/arm64,linux/arm/v7
      build-args: VERSION={ref}-{sha7}
      tag-build-args: VERSION={ref}
      visibility: public
      runs-on: ubuntu-latest
      timeout-minutes: 90
    permissions:
      contents: read
      packages: write
  image-wg-gateway:
    needs: [test-go-vet, test-go-test-race]
    uses: teknoir/ci-workflows/.github/workflows/image.yml@main
    with:
      image: wg-gateway
      target: wg-gateway
      platforms: linux/amd64,linux/arm64
      build-args: VERSION={ref}-{sha7}
      tag-build-args: VERSION={ref}
